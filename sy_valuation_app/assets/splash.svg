<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <!--
    SY Valuation 스플래시 (2732x2732, CENTER_CROP)
    세로/가로 화면으로 잘려도 보이도록 콘텐츠는 중앙 1400px 안에 배치.
    텍스트는 CI(Linux) 폰트 호환을 위해 영문만 사용.
  -->
  <rect width="2732" height="2732" fill="#0a0a0a"/>
  <!-- 마크: logo.svg 의 480x454 콘텐츠를 1.3배로 중앙 상단에 -->
  <g transform="translate(1366 1180) scale(1.3) translate(-512 -517)">
    <line x1="272" y1="312" x2="752" y2="312" stroke="#22c55e" stroke-width="44" stroke-linecap="round"/>
    <rect x="300" y="548" width="112" height="196" rx="26" fill="#fafaf9"/>
    <rect x="456" y="464" width="112" height="280" rx="26" fill="#fafaf9"/>
    <rect x="612" y="380" width="112" height="364" rx="26" fill="#fafaf9"/>
  </g>
  <!-- 워드마크 -->
  <text x="50%" y="1690" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"
        font-weight="800" font-size="132" letter-spacing="30" fill="#fafaf9">SY VALUATION</text>
  <text x="50%" y="1800" text-anchor="middle"
        font-family="Consolas,'DejaVu Sans Mono',monospace"
        font-size="60" letter-spacing="18" fill="#737373">FAIR VALUE · 9 MODELS · SY METHOD</text>
</svg>
